name: Update Monopoly GO links
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:          # "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: Commit if changed
        run: |
          git config user.name "links-bot"
          git config user.email "actions@users.noreply.github.com"
          git add links.json
          if ! git diff --cached --quiet; then git commit -m "Update links"; git push; fi
